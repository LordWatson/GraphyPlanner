<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline — Alima</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                background: #f5f2e8;
                color: #181723;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #181723;
                    color: #f5f2e8;
                }
            }
            .card {
                max-width: 24rem;
                text-align: center;
            }
            .mark {
                width: 56px;
                height: 56px;
                margin: 0 auto 1.5rem;
                border-radius: 16px;
                display: block;
            }
            h1 {
                font-size: 1.375rem;
                line-height: 1.2;
                margin: 0 0 0.5rem;
            }
            p {
                margin: 0 0 1.5rem;
                opacity: 0.7;
                line-height: 1.5;
            }
            button {
                font: inherit;
                font-weight: 600;
                cursor: pointer;
                border: 0;
                border-radius: 999px;
                padding: 0.7rem 1.5rem;
                background: #205557;
                color: #f5f2e8;
            }
            button:hover {
                opacity: 0.92;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img class="mark" src="/icons/icon-192.png" alt="Alima" />
            <h1>You're offline</h1>
            <p>
                We can't reach the internet right now. Your drafts are safe —
                reconnect and we'll pick up where you left off.
            </p>
            <button type="button" onclick="location.reload()">Try again</button>
        </div>
    </body>
</html>
